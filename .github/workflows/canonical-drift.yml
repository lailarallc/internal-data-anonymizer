name: canonical-drift

# Fails the build if a retired Cinderhaven figure/string reaches a live surface.
# Tokens come from the vendored reference/supersedes.txt. See
# scripts/check_canonical_drift.py.
#
# internal-data-anonymizer has no deploy path today. This workflow exists so the
# server-side engagement guard and the drift gate are already wired if a deploy
# path is ever added to the confidentiality-gate tool — the guard should not
# depend on anyone remembering to add it later.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Engagement guard
        run: python3 scripts/engagement_guard.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical drift gate
        run: python scripts/check_canonical_drift.py
